<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPrompt — Your AI Fitness Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #C8F135;
    --dark: #0E0F0A;
    --surface: #181910;
    --card: #1F2015;
    --border: rgba(200,241,53,0.15);
    --muted: #6B6E5A;
    --text: #F0F0E8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    padding: 2.5rem 2rem 0;
    max-width: 760px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.04em;
    color: var(--lime);
    line-height: 1;
  }

  .tagline {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
  }

  .prompt-section {
    margin-top: 2rem;
  }

  .prompt-label {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .prompt-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .prompt-box:focus-within {
    border-color: rgba(200,241,53,0.45);
  }

  textarea {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    resize: none;
    width: 100%;
    min-height: 90px;
    line-height: 1.7;
    caret-color: var(--lime);
  }

  textarea::placeholder {
    color: var(--muted);
    font-style: italic;
  }

  .prompt-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .prompt-hints {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hint {
    font-size: 0.75rem;
    background: rgba(200,241,53,0.08);
    color: rgba(200,241,53,0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .hint:hover {
    background: rgba(200,241,53,0.15);
  }

  .generate-btn {
    background: var(--lime);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .generate-btn:hover { opacity: 0.88; }
  .generate-btn:active { transform: scale(0.97); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 2rem 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .loading.active { display: flex; }

  .dots {
    display: flex;
    gap: 5px;
  }

  .dots span {
    width: 6px;
    height: 6px;
    background: var(--lime);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Plan output */
  #plan-output { display: none; margin-top: 2.5rem; animation: fadeUp 0.4s ease; }
  #plan-output.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .plan-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  .plan-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--lime);
    letter-spacing: 0.04em;
  }

  .plan-meta {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Summary strip */
  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--lime);
  }

  /* Day cards */
  .days-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .day-card:hover { border-color: rgba(200,241,53,0.3); }

  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }

  .day-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .day-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--lime);
    letter-spacing: 0.04em;
    line-height: 1;
    width: 40px;
  }

  .day-info { display: flex; flex-direction: column; }

  .day-name {
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text);
  }

  .day-type {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 1px;
  }

  .day-badge {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
    font-weight: 500;
  }

  .badge-strength { color: #FF6B6B; border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
  .badge-cardio { color: #4ECDC4; border-color: rgba(78,205,196,0.3); background: rgba(78,205,196,0.08); }
  .badge-rest { color: var(--muted); border-color: rgba(107,110,90,0.3); background: rgba(107,110,90,0.08); }
  .badge-hiit { color: #FFD93D; border-color: rgba(255,217,61,0.3); background: rgba(255,217,61,0.08); }
  .badge-flexibility { color: #A78BFA; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
  .badge-active { color: var(--lime); border-color: var(--border); background: rgba(200,241,53,0.08); }

  .chevron {
    color: var(--muted);
    font-size: 1.1rem;
    transition: transform 0.25s;
  }

  .day-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px 18px 18px;
  }

  .day-body.open { display: block; animation: slideDown 0.2s ease; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .exercises {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .exercise-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.025);
    border-radius: 8px;
  }

  .ex-dot {
    width: 6px;
    height: 6px;
    background: var(--lime);
    border-radius: 50%;
    margin-top: 7px;
    flex-shrink: 0;
  }

  .ex-details { flex: 1; }

  .ex-name {
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text);
  }

  .ex-meta {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .ex-tip {
    font-size: 0.78rem;
    font-style: italic;
    color: rgba(200,241,53,0.5);
    margin-top: 4px;
  }

  .day-note {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(200,241,53,0.05);
    border-left: 2px solid var(--lime);
    border-radius: 0 6px 6px 0;
    font-size: 0.83rem;
    color: rgba(240,240,232,0.7);
    font-style: italic;
  }

  /* Nutrition section */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--lime);
    letter-spacing: 0.04em;
    margin: 2rem 0 1rem;
  }

  .nutrition-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .nutrition-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .nutrition-title {
    font-weight: 500;
    font-size: 0.88rem;
    color: var(--text);
    margin-bottom: 6px;
  }

  .nutrition-text {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* Tips */
  .tips-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tip-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 0.88rem;
    color: rgba(240,240,232,0.75);
    line-height: 1.5;
  }

  .tip-num {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--lime);
    font-size: 1rem;
    line-height: 1.4;
    min-width: 18px;
  }

  /* Error */
  .error-msg {
    display: none;
    color: #FF6B6B;
    font-size: 0.85rem;
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(255,107,107,0.08);
    border-radius: 8px;
    border: 1px solid rgba(255,107,107,0.2);
  }

  .error-msg.show { display: block; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 2rem;
    display: block;
  }

  .reset-btn:hover { border-color: rgba(200,241,53,0.3); color: var(--lime); }

  .key-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 1.5rem;
  }
  .key-bar label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .key-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; caret-color: var(--lime); }
  .key-bar input::placeholder { color: var(--muted); }
  .key-status { font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .key-status.ok { background: rgba(200,241,53,0.1); color: var(--lime); border: 1px solid var(--border); }
  .key-status.empty { background: rgba(107,110,90,0.1); color: var(--muted); border: 1px solid rgba(107,110,90,0.2); }

  @media (max-width: 540px) {
    .logo { font-size: 2.2rem; }
    .prompt-hints { display: none; }
    .summary-strip { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">FitPrompt</div>
  <div class="tagline">AI-powered personal training plans</div>
</header>

<main>
  <div class="prompt-section">
    <div class="prompt-label">Describe yourself & your goals</div>
    <div class="prompt-box">
      <textarea id="prompt-input" placeholder="e.g. I'm 28, work a desk job, 30 mins a day max, want to build strength and lose some belly fat. I have dumbbells at home..." rows="4"></textarea>
      <div class="prompt-footer">
        <div class="prompt-hints">
          <span class="hint" onclick="setHint(this)">Busy professional, weight loss</span>
          <span class="hint" onclick="setHint(this)">Beginner, muscle gain, gym</span>
          <span class="hint" onclick="setHint(this)">Runner, improve endurance</span>
          <span class="hint" onclick="setHint(this)">Home workout, no equipment</span>
        </div>
        <button class="generate-btn" id="gen-btn" onclick="generatePlan()">Generate plan ↗</button>
      </div>
    </div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="loading" id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <span>Building your personalized plan...</span>
  </div>

  <div id="plan-output"></div>
</main>

<script>
const HINTS = {
  "Busy professional, weight loss": "I'm a busy professional with only 30 minutes a day. I want to lose weight and feel more energetic. I can work out at home and have resistance bands.",
  "Beginner, muscle gain, gym": "I'm a complete beginner at the gym. I want to build muscle and gain strength. I have access to a full gym with free weights and machines.",
  "Runner, improve endurance": "I'm an intermediate runner looking to improve my 5K time and overall endurance. I run 3 times a week and want a balanced plan.",
  "Home workout, no equipment": "I want to get fit with zero equipment at home. I'm intermediate level and have about 45 minutes, 5 days a week. Focus on bodyweight fitness."
};

function setHint(el) {
  document.getElementById('prompt-input').value = HINTS[el.textContent.trim()] || el.textContent;
}

function toggleDay(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.day-body.open').forEach(b => {
    b.classList.remove('open');
    b.previousElementSibling.querySelector('.chevron').textContent = '›';
  });
  if (!isOpen) {
    body.classList.add('open');
    chevron.textContent = '⌄';
  }
}

function getBadgeClass(type) {
  const t = (type || '').toLowerCase();
  if (t.includes('strength') || t.includes('weight')) return 'badge-strength';
  if (t.includes('cardio')) return 'badge-cardio';
  if (t.includes('rest') || t.includes('recovery')) return 'badge-rest';
  if (t.includes('hiit') || t.includes('interval')) return 'badge-hiit';
  if (t.includes('flex') || t.includes('yoga') || t.includes('stretch')) return 'badge-flexibility';
  return 'badge-active';
}

function renderPlan(plan) {
  const out = document.getElementById('plan-output');

  const summaryHTML = `
    <div class="summary-strip">
      <div class="stat-card"><div class="stat-label">Duration</div><div class="stat-value">${plan.summary.duration}</div></div>
      <div class="stat-card"><div class="stat-label">Level</div><div class="stat-value">${plan.summary.level}</div></div>
      <div class="stat-card"><div class="stat-label">Days/week</div><div class="stat-value">${plan.summary.daysPerWeek}</div></div>
      <div class="stat-card"><div class="stat-label">Focus</div><div class="stat-value">${plan.summary.focus}</div></div>
    </div>`;

  const daysHTML = plan.days.map((day, i) => `
    <div class="day-card">
      <div class="day-header" onclick="toggleDay(this)">
        <div class="day-left">
          <div class="day-num">D${i + 1}</div>
          <div class="day-info">
            <div class="day-name">${day.name}</div>
            <div class="day-type">${day.duration || ''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="day-badge ${getBadgeClass(day.type)}">${day.type}</span>
          <span class="chevron">›</span>
        </div>
      </div>
      <div class="day-body">
        <div class="exercises">
          ${(day.exercises || []).map(ex => `
            <div class="exercise-row">
              <div class="ex-dot"></div>
              <div class="ex-details">
                <div class="ex-name">${ex.name}</div>
                <div class="ex-meta">${ex.sets || ''}</div>
                ${ex.tip ? `<div class="ex-tip">${ex.tip}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
        ${day.note ? `<div class="day-note">${day.note}</div>` : ''}
      </div>
    </div>
  `).join('');

  const nutritionHTML = plan.nutrition ? `
    <div class="section-title">Nutrition guidelines</div>
    <div class="nutrition-grid">
      ${plan.nutrition.map(n => `
        <div class="nutrition-card">
          <div class="nutrition-title">${n.title}</div>
          <div class="nutrition-text">${n.text}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const tipsHTML = plan.tips && plan.tips.length ? `
    <div class="section-title">Pro tips</div>
    <div class="tips-list">
      ${plan.tips.map((tip, i) => `
        <div class="tip-row">
          <div class="tip-num">${i + 1}.</div>
          <div>${tip}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  out.innerHTML = `
    <div class="plan-header">
      <div class="plan-title">${plan.title}</div>
      <div class="plan-meta">Your 7-day plan</div>
    </div>
    ${summaryHTML}
    <div class="days-grid">${daysHTML}</div>
    ${nutritionHTML}
    ${tipsHTML}
    <button class="reset-btn" onclick="resetPlan()">← Generate a new plan</button>
  `;

  out.classList.add('visible');

  // Auto-open day 1
  const firstHeader = out.querySelector('.day-header');
  if (firstHeader) toggleDay(firstHeader);
}

function resetPlan() {
  document.getElementById('plan-output').classList.remove('visible');
  document.getElementById('plan-output').innerHTML = '';
  document.getElementById('prompt-input').focus();
}

async function generatePlan() {
  const prompt = document.getElementById('prompt-input').value.trim();
  if (!prompt) {
    document.getElementById('prompt-input').focus();
    return;
  }

  const btn = document.getElementById('gen-btn');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error-msg');
  const output = document.getElementById('plan-output');

  btn.disabled = true;
  loading.classList.add('active');
  errorEl.classList.remove('show');
  output.classList.remove('visible');
  output.innerHTML = '';

  const systemPrompt = `You are an expert certified personal trainer and nutritionist. The user will describe themselves and their fitness goals. You must respond with ONLY a valid JSON object (no markdown, no backticks, no explanation) with this exact structure:

{
  "title": "Short motivating plan name (e.g. 'The Lean Machine Protocol')",
  "summary": {
    "duration": "e.g. 45 min/day",
    "level": "e.g. Beginner",
    "daysPerWeek": "e.g. 5 days",
    "focus": "e.g. Fat loss"
  },
  "days": [
    {
      "name": "Day label (e.g. 'Upper Body Strength')",
      "type": "e.g. Strength / Cardio / HIIT / Rest / Flexibility",
      "duration": "e.g. 40 minutes",
      "exercises": [
        {
          "name": "Exercise name",
          "sets": "e.g. 3 sets × 12 reps or 20 minutes",
          "tip": "Optional short form tip"
        }
      ],
      "note": "Optional motivating note for the day"
    }
  ],
  "nutrition": [
    { "title": "e.g. Pre-workout", "text": "Short practical advice" },
    { "title": "e.g. Protein", "text": "Short practical advice" },
    { "title": "e.g. Hydration", "text": "Short practical advice" },
    { "title": "e.g. Recovery meals", "text": "Short practical advice" }
  ],
  "tips": ["Tip 1", "Tip 2", "Tip 3"]
}

Always include exactly 7 days. Make the plan realistic, specific, and personalized to what the user described. Include warm-up and cool-down in exercises where relevant. Respond ONLY with the JSON object.`;

  const apiKey = 'AIzaSyD-1voFzj-oUqqC55CYUHBxG6qygdSB2sU';

  try {
    let response, data, raw, plan;

    response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: systemPrompt + '\n\nUser request: ' + prompt }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 4000 }
        })
      }
    );

    data = await response.json();

    if (!response.ok) {
      throw new Error(data?.error?.message || 'API returned status ' + response.status);
    }

    raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!raw) throw new Error('Empty response from Gemini');

    const jsonMatch = raw.replace(/```json|```/g, '').match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('Could not find JSON in response');

    plan = JSON.parse(jsonMatch[0]);
    renderPlan(plan);

  } catch (err) {
    errorEl.textContent = 'Error: ' + (err.message || 'Something went wrong');
    errorEl.classList.add('show');
    console.error('FitPrompt error:', err);
  } finally {
    btn.disabled = false;
    loading.classList.remove('active');
  }
}



document.getElementById('prompt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generatePlan();
});
</script>
</body>
</html>
